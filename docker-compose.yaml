services:
  api:
    container_name: evolution_api_iautomatic2
    image: evoapicloud/evolution-api:v2.3.6
    restart: always
    # depends_on:
    #   - redis
    #   - evolution-postgres
    # ports:
      # - "127.0.0.1:8080:8080"
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - evolution-net
      - dokploy-network
    env_file:
      - .env
    expose:
      - "8080"

volumes:
  evolution_instances:

networks:
  evolution-net:
    name: evolution-net
    driver: bridge
  dokploy-network:
    external: true